[project]
name = "pygtfslib"
description = "A Python Library for GTFS"
readme = "README.md"
dependencies = ["python-dateutil"]
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Alexander Held | geOps", email = "alexander.held@geops.com"}]
maintainers = [{name = "Alexander Held | geOps", email = "alexander.held@geops.com"}]
keywords = [
  "public transport",
  "GTFS",
  "library",
  "efficient",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mypy",
    "types-python-dateutil",
]

[project.urls]
homepage = "https://github.com/geops/pygtfslib"
geOps = "https://geops.com/en"

[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["pygtfslib", "pygtfslib.*"]

[tool.uv]
cache-keys = [
    # default
    { file = "pyproject.toml"},
    # for non-editable installs (dynamic setuptools_scm versioning)
    { git = { commit = true } },
]
environments = ["sys_platform == 'linux'"]

[tool.ruff.lint]
select = [
    "F",       # pyflakes
    "E",       # pycodestyle
    "W",       # pycodestyle
    "UP",      # pyupgrade
    "YTT",     # no sys.version tuple comparisons
    "ASYNC",   # no obviously blocking io in corotine
    "G",       #  flake8-logging-format
    "PIE",     # unnecessary statements
    "SLOT",    # str, tuple, namedtuple subclasses need __slots__
    "FIX003",  # line contains XXX
    "SIM",     # flake8-simplify
    "I",       # sort imports
    "T100",    # breakpoints
]
ignore = [
    "E501",  # line too long
]

[tool.mypy]
ignore_missing_imports = true
# If we allow to install types, mypy will use pip to alter the venv with unpinned extra
# type stubs. We are on a pure uv setup and don't have pip. Also we want everything
# pinned. Thus all missing type stubs have to go to dev dependencies.
install_types = false
non_interactive = false

[tool.pytest]

[too.coverage.run]
branch = true
source = ["pygtfslib"]
omit = [
    "*/setup.py",
    "pygtfslib/test/*",
]
