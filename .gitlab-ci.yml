image: registry.geops.com/geops/gitlab-ci-dockerfiles/bookworm-python:latest

stages:
  - test

variables:
  # Fail instead of updating uv.lock if it is out of sync with pyproject.toml.
  UV_LOCKED: "1"
  UV_NO_EDITABLE: "1"
  XDG_CACHE_HOME: "${CI_PROJECT_DIR}/.cache/"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

cache:
  # key just that cache does not grow unbounded
  key:
    files:
      - uv.lock
      - .pre-commit-config.yaml
  paths:
    - .cache

default:
  before_script:
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\nStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$GITLAB_PIPELINES_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - uv cache dir && uv --preview-features=cache-size cache size --human

  after_script:
    - eval "$(ssh-agent -k)" # to stop ssh-agent from running forever

run_tests:
  stage: test
  needs: []
  script:
    - uv run pytest -s -vvv --log-cli-level INFO --cov=pygtfslib --cov-report term --cov-report xml:cobertura_coverage.xml --cov-fail-under=40 --junitxml=junit_coverage.xml pygtfslib
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura_coverage.xml
      junit: junit_coverage.xml

run_pre_commit_checks:
  stage: test
  needs: []
  script:
    # We have to uv run here since we still have a system mypy hook that needs installed
    # dependencies. Could be fixed by using ty and calling it without installing
    # anything since ty can handle dependencies on its own (mypy and pyright can't do
    # that).
    - uv run pre-commit run --all-files
  except:
    - master
